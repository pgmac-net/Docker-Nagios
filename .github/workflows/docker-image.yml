name: Build my Nagios image and push to my registry

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions: {}

jobs:
  slack-start:
    uses: pgmac-net/pg-actions/.github/workflows/slack-notify-start.yml@main
    secrets: inherit

  build-n-push:
    needs: [slack-start]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.vars.outputs.tag }}
    # self-hosted: builds via BuildKit over TCP to buildkitd.arc-runners.svc.cluster.local and
    # pushes to macro.int.pgmac.net:5000, then attests against that registry. See pgmac-net/homelabia#176.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Set the image version
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx (remote BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: macro.int.pgmac.net:5000/nagios:${{ inputs.tags || steps.vars.outputs.tag }}

  image-sbom:
    # Shared image SBoM (pg-actions#202): trivy CycloneDX by digest, uploaded to Dependency-Track as
    # the image project macro.int.pgmac.net:5000/nagios / <tag>@<digest>, then attested with the
    # SBoM (public repo). Replaces the syft scan and the upload to a stored project UUID.
    needs: [build-n-push]
    uses: pgmac-net/pg-actions/.github/workflows/image-sbom.yml@8d3f236e838c0d645c3c21e79e912f862283f853 # main
    with:
      image: macro.int.pgmac.net:5000/nagios
      digest: ${{ needs.build-n-push.outputs.digest }}
      tag: ${{ needs.build-n-push.outputs.tag }}
      insecure-registry: true
    permissions:
      id-token: write
      attestations: write
      contents: read
    secrets:
      DT_HOST: ${{ secrets.DT_HOST }}
      DT_APIKEY: ${{ secrets.DT_APIKEY }}

  slack-end:
    if: always()
    needs: [slack-start, build-n-push, image-sbom]
    uses: pgmac-net/pg-actions/.github/workflows/slack-notify-end.yml@main
    with:
      ts: ${{ needs.slack-start.outputs.ts }}
      start: ${{ needs.slack-start.outputs.start }}
      startfmt: ${{ needs.slack-start.outputs.startfmt }}
      status: ${{ needs.build-n-push.result }}
    secrets: inherit
